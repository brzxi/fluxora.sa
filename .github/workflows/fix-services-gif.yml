name: Fix services GIF colors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-services-gif.yml'

permissions:
  contents: write

jobs:
  fix-gif:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fontconfig
          python -m pip install --quiet pillow
      - name: Generate Safari-safe services GIF
        run: |
          cat > /tmp/make_services.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import math, subprocess, os

          W,H = 1000,170
          BG=(6,21,43)
          CYAN=(0,200,255)
          CYAN2=(34,230,255)
          WHITE=(247,251,255)
          MUTED=(42,83,126)
          text='خدماتنا'

          try:
              font_path=subprocess.check_output(['fc-match','-f','%{file}','Noto Kufi Arabic'], text=True).strip()
          except Exception:
              font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font=ImageFont.truetype(font_path,74)

          probe=Image.new('RGB',(W,H),BG)
          pd=ImageDraw.Draw(probe)
          try:
              bbox=pd.textbbox((0,0),text,font=font,direction='rtl',language='ar')
              rtl=True
          except Exception:
              bbox=pd.textbbox((0,0),text,font=font)
              rtl=False
          tw,th=bbox[2]-bbox[0],bbox[3]-bbox[1]
          tx,ty=(W-tw)//2,26
          kw={'direction':'rtl','language':'ar'} if rtl else {}

          rgb_frames=[]
          for i in range(14):
              t=i/14
              img=Image.new('RGB',(W,H),BG)
              d=ImageDraw.Draw(img)
              pulse=(math.sin(t*2*math.pi-math.pi/2)+1)/2
              cy=83
              gap=tw//2+75
              ll=int(125+75*pulse)
              d.line((W//2-gap-ll,cy,W//2-gap,cy),fill=MUTED,width=9)
              d.line((W//2+gap,cy,W//2+gap+ll,cy),fill=MUTED,width=9)
              d.line((W//2-gap-ll,cy,W//2-gap,cy),fill=CYAN,width=3)
              d.line((W//2+gap,cy,W//2+gap+ll,cy),fill=CYAN,width=3)
              d.text((tx,ty),text,font=font,fill=WHITE,**kw)
              uw=int(70+24*(0.5+0.5*math.sin(t*2*math.pi)))
              uy=140
              d.rounded_rectangle((W//2-uw-6,uy-4,W//2+uw+6,uy+10),radius=7,fill=(11,48,75))
              d.rounded_rectangle((W//2-uw,uy,W//2+uw,uy+6),radius=3,fill=CYAN2)
              sx=int(W//2-uw + (2*uw)*((t*1.8)%1.0))
              d.ellipse((sx-4,uy-4,sx+4,uy+10),fill=WHITE)
              rgb_frames.append(img)

          sheet=Image.new('RGB',(W,H*len(rgb_frames)),BG)
          for idx,fr in enumerate(rgb_frames):
              sheet.paste(fr,(0,idx*H))
          palette_img=sheet.quantize(colors=32,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.NONE)
          pal=palette_img.getpalette()
          shared=Image.new('P',(1,1))
          shared.putpalette(pal)
          frames=[fr.quantize(palette=shared,dither=Image.Dither.NONE) for fr in rgb_frames]

          os.makedirs('fluxora-assets',exist_ok=True)
          frames[0].save('fluxora-assets/services.gif',save_all=True,append_images=frames[1:],duration=90,loop=0,optimize=False,disposal=1)
          print('created', os.path.getsize('fluxora-assets/services.gif'))
          PY
          python /tmp/make_services.py
          test -s fluxora-assets/services.gif
      - name: Commit fixed GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fluxora-assets/services.gif
          git diff --cached --quiet && exit 0
          git commit -m "Fix services GIF colors for Safari"
          git push

# trigger 2
