name: Add discover categories GIF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-discover-categories-gif.yml'

permissions:
  contents: write

jobs:
  add-gif:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download GIF
        run: |
          mkdir -p fluxora-assets
          curl -L --fail --retry 3 "https://at.adobe.com/EMFIotAQgKhfu5te" -o fluxora-assets/discover-categories.gif
          test -s fluxora-assets/discover-categories.gif
      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fluxora-assets/discover-categories.gif
          git diff --cached --quiet && exit 0
          git commit -m "Add animated discover categories banner"
          git push
